#
# Default punishments
#
default:
  ban:
    seconds: 15
    message: |-
      &cCombat Log Detected
      &7You logged out during &6combat&7.
      &7Please wait &f%combatlogger_timeformatted%&7 before rejoining.
  eco:
    amount: -1500
    message: '&7You lost &6$1,500 &7for logging out during &ccombat&7.'
  kill: { }

#
# Permission-based punishments
#
permissions:
  enabled: false
  vip:
    permission: "combatlogger.punishments.vip"
    punishments:
      ban:
        seconds: 8
        message: |-
          &cCombat Log Detected
          &7You logged out during &6combat&7.
          &7Please wait &f%combatlogger_timeformatted%&7 before rejoining.
      kill: { }
      command: "broadcast &6%player% &7logged out during &ccombat&7."

  express:
    permission: "combatlogger.punishments.express"
    punishments:
      kill: { }
      command: "broadcast &6%player% &7logged out during &ccombat&7."
